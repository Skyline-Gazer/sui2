<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{title}}</title>
  <meta charset="utf-8">
  <meta name="description" content="{{description}}">
  <meta content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
  <link rel="shortcut icon" href="/icon-512.png" type="image/png">
  <script>
    // apply the theme the user picked on the startpage (same CSS variables
    // and localStorage keys as js/themer.js), before the body renders
    (function () {
      var root = document.documentElement;
      ['color-background', 'color-text-pri', 'color-text-acc'].forEach(function (key) {
        var value = localStorage.getItem(key);
        if (value) root.style.setProperty('--' + key, value);
      });
    })();
  </script>
  <style>
    html,
    body {
      background-color: var(--color-background, #ffffff);
      color: var(--color-text-pri, #000000);
    }
    .container {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, Helvetica Neue, Roboto, sans-serif;
      margin-top: 20vh;
    }
    .container * {
      align-self: center;
    }
    h1 {
      font-size: 4em;
      font-weight: 700;
      margin: 0 0 0.5em;
    }
    p {
      color: var(--color-text-acc, #666666);
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404 Not Found</h1>
    <p>
      You are coming to the wrong place.
    </p>
  </div>

</body>
</html>
