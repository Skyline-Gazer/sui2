<!DOCTYPE html>
<html lang="en">
<head>
  <title>Page not found{{#if title}} | {{title}}{{/if}}</title>
  <meta charset="utf-8">
  <meta name="description" content="The page you requested could not be found. Return to the startpage to continue browsing.">
  <meta content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
  <link rel="shortcut icon" href="/icon-512.png" type="image/png">
  <script>
    // apply the theme the user picked on the startpage (same CSS variables
    // and localStorage keys as js/themer.js), before the body renders
    (function () {
      var root = document.documentElement;
      ['color-background', 'color-text-pri', 'color-text-acc'].forEach(function (key) {
        var value = localStorage.getItem(key);
        if (value) root.style.setProperty('--' + key, value);
      });
    })();
  </script>
  <style>
    html,
    body {
      background-color: var(--color-background, #ffffff);
      color: var(--color-text-pri, #000000);
    }
    .container {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, Helvetica Neue, Roboto, sans-serif;
      margin-top: 20vh;
    }
    .container * {
      align-self: center;
    }
    h1 {
      font-size: 4em;
      font-weight: 700;
      margin: 0 0 0.5em;
    }
    p {
      color: var(--color-text-acc, #666666);
      margin: 0;
    }
    .home-link {
      border: 1px solid currentColor;
      border-radius: 0.35em;
      color: inherit;
      margin-top: 2em;
      padding: 0.65em 1em;
      text-decoration: none;
    }
    .home-link:hover,
    .home-link:focus-visible {
      background-color: var(--color-text-pri, #000000);
      color: var(--color-background, #ffffff);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Page not found</h1>
    <p>
      The page you requested does not exist or may have moved.
    </p>
    <a class="home-link" href="/">Return to startpage</a>
  </div>

</body>
</html>
