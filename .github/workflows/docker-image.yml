name: Docker Image CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

env:
  IMAGE_NAME: sui2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR image names must be lowercase; github.repository may contain
      # uppercase characters (e.g. Skyline-Gazer/sui2)
      - name: Lowercase repository name
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # authenticate against GitHub Container Registry with the automatic
      # GITHUB_TOKEN (no DOCKER_USERNAME/DOCKER_PASSWORD secrets needed)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}:latest
            ghcr.io/${{ steps.repo.outputs.lower }}:${{ github.sha }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
