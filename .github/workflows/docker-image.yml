name: Docker Image CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

env:
  IMAGE_NAME: sui2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR image names must be lowercase; github.repository may contain
      # uppercase characters (e.g. Skyline-Gazer/sui2)
      - name: Lowercase repository name
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # authenticate against GitHub Container Registry with the automatic
      # GITHUB_TOKEN (no DOCKER_USERNAME/DOCKER_PASSWORD secrets needed)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}:latest
            ghcr.io/${{ steps.repo.outputs.lower }}:${{ github.sha }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
