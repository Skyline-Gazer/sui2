name: Docker Image CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

# serialize runs on the same branch: overlapping runs would otherwise race
# on the shared tmp-* tags, mixing artifacts from different commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/skyline-gazer/sui2

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # native runners per architecture: no QEMU emulation, much faster
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # push to a per-commit temporary tag (tmp-<sha>-<arch>) so a merge
      # job can only ever resolve artifacts built from its own commit
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:tmp-${{ github.sha }}-${{ matrix.arch }}

  merge:
    name: Create multi-arch manifests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # imagetools create keeps buildx provenance/attestations (docker
      # manifest create does not). The tmp-* tags can be removed manually
      # later on the package page or with a GHCR retention policy.
      - name: Merge manifests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:tmp-${{ github.sha }}-amd64 ${{ env.IMAGE }}:tmp-${{ github.sha }}-arm64
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            ${{ env.IMAGE }}:tmp-${{ github.sha }}-amd64 ${{ env.IMAGE }}:tmp-${{ github.sha }}-arm64
      - name: Image digest
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest
