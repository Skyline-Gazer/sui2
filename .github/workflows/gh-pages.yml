name: GitHub Pages

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # actions-gh-pages pushes the built site to the gh-pages branch.
      # deploy: false below means we only write that branch; the push itself
      # is what triggers GitHub's own branch-based Pages build. We deliberately
      # DON'T create a GitHub deployment (environment: github-pages), because
      # Pages is configured branch-based ("Deploy from a branch") and that
      # deployment queue would fight the built-in workflow and stall forever.
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list

      - run: npm i
      - run: npm run build
        env:
          WEBMANIFEST_SCOPE: /sui2/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          # Pure branch push only: do NOT create a GitHub Pages deployment/status
          # (that is handled by the built-in "pages-build-deployment" workflow
          # that watches the gh-pages branch).
          deploy: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
